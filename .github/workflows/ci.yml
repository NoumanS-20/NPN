name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --no-save jsdom

      # Node is used only to run the front-end tests. Nothing is bundled or built:
      # the browser loads the ES modules directly.
      - name: Front-end tests
        run: |
          if compgen -G "packages/web/tests/*.test.js" > /dev/null; then
            node --test packages/web/tests apps/*/web/tests 2>/dev/null || node --test packages/web/tests
          else
            echo "No front-end tests yet."
          fi
        shell: bash
