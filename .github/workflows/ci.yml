name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff kaggle

      # The raw datasets are 212 MB and gitignored. Cache them on the dataset
      # register, so a normal push restores them instead of re-downloading.
      - name: Restore dataset cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/fetch_data.py') }}

      - name: Fetch datasets
        if: steps.data-cache.outputs.cache-hit != 'true'
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
        run: |
          if [ -z "$KAGGLE_ACCESS_TOKEN" ]; then
            echo "No KAGGLE_ACCESS_TOKEN secret — data-backed tests will skip."
            exit 0
          fi
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          python scripts/fetch_data.py

      - name: Report dataset status
        run: python scripts/fetch_data.py --check || echo "Datasets absent; data-backed tests will skip."

      - name: Lint
        run: ruff check .

      # Tests that read raw data skip themselves when it is absent (conftest.py),
      # so the suite is meaningful with or without Kaggle credentials.
      - name: Tests
        run: pytest -q -rs

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --no-save jsdom

      # Node runs the front-end tests only. Nothing is bundled or built: the
      # browser loads the ES modules directly.
      # `node --test` with a directory argument makes Node resolve the path as a
      # module and fail. Run it from the package with no argument instead, which
      # is Node's own recursive discovery and is the command the README and the
      # runbook document — so CI and a laptop run exactly the same thing.
      - name: Front-end tests
        working-directory: packages/web
        run: node --test
